name: CI and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'codex-gateway').version
          if (-not $version) { throw 'Package version not found' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Console regression checks
        shell: powershell
        run: ./tests/console.ps1

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release --locked

      - name: Package portable distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/package -Force | Out-Null
          Copy-Item -LiteralPath target/release/codex-gateway.exe, README.md, README.en.md, LICENSE, 'codex-gateway 控制台.ps1', 'codex-gateway 控制台.bat', '安装到开始菜单.ps1' -Destination dist/package
          Copy-Item -LiteralPath assets -Destination dist/package -Recurse
          Copy-Item -LiteralPath docs -Destination dist/package -Recurse
          Compress-Archive -Path dist/package/* -DestinationPath dist/codex-gateway-windows-x86_64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-gateway-windows-x86_64
          path: dist/codex-gateway-windows-x86_64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check whether this version is already published
        id: published
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: v${{ needs.test.outputs.version }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.RELEASE_TAG });
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('exists', 'false');
            }

      - uses: actions/checkout@v4
        if: steps.published.outputs.exists != 'true'
        with:
          ref: ${{ github.sha }}

      - name: Download verified distribution
        if: steps.published.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: codex-gateway-windows-x86_64
          path: dist

      - name: Publish GitHub Release
        if: steps.published.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.version }}
          name: codex-gateway v${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: docs/RELEASE-NOTES.md
          files: dist/codex-gateway-windows-x86_64.zip
